\* Step 4: Durable-ask.cfg checking liveness: an answer reaches a waiting
\* call, a question Blip didn't handle reaches the owner, a call that ends
\* closes its question, and the thread's run settles if the owner
\* eventually answers what reaches them (SpecOwnerAnswers). With a hub
\* crash, a Scheduler crash and a step crash. Expected: no error.
SPECIFICATION SpecOwnerAnswers
CONSTANTS
    Users = {"u1"}
    NTools = 1
    Routines = {}
    MaxRounds = 2
    MaxCalls = 1
    ToolTypes = {"ask"}
    GenPolicy = "all_settled"
    LLMErrors = TRUE
    MachineOffline = FALSE
    MaxRechecks = 1
    MaxHubCrashes = 1
    MaxSchedCrashes = 1
    MaxStepCrashes = 1
    MaxAborts = 1
    Spares = {}
    MaxFires = 1
    MaxEdits = 0
    MaxDeletes = 0
    Target = "conv"
    BugEditKeepsOld = FALSE
    BugFireIgnoresAbort = FALSE
    BugAskUnfenced = FALSE
    BugAnswerAnyStatus = FALSE
PROPERTIES
    AnsweredCallEnds
    UnhandledReachesOwner
    CallEndClosesQuestion
    PlacedSettles
    NoRunningForever
CHECK_DEADLOCK FALSE
