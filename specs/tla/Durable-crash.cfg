\* Regression for Durable F2/F3 with a step crash instead of a Stop (a step
\* that dies after the session started, or after resume aborted the watcher).
\* Before the fix DeliveredOnceAnswered failed (15 states). Expected: no error.
SPECIFICATION Spec
CONSTANTS
    Users = {"u1"}
    NTools = 1
    Routines = {}
    MaxRounds = 3
    MaxCalls = 1
    ToolTypes = {"node"}
    GenPolicy = "all_settled"
    LLMErrors = FALSE
    NodeOffline = FALSE
    MaxHubCrashes = 0
    MaxSchedCrashes = 0
    MaxStepCrashes = 1
    MaxAborts = 0
PROPERTIES
    DeliveredOnceAnswered
CHECK_DEADLOCK FALSE
