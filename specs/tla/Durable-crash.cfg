\* Regression for Durable F3 with a step crash instead of a Stop, redone for
\* machine calls: a step that exits, or a machine call that raises, at any
\* point still cancels or closes its op's row (hub rule 10). Expected: no
\* error.
SPECIFICATION Spec
CONSTANTS
    Users = {"u1"}
    NTools = 1
    Routines = {}
    MaxRounds = 3
    MaxCalls = 1
    ToolTypes = {"machine"}
    GenPolicy = "all_settled"
    LLMErrors = FALSE
    MachineOffline = FALSE
    MaxRechecks = 1
    MaxHubCrashes = 0
    MaxSchedCrashes = 0
    MaxStepCrashes = 1
    MaxAborts = 0
    Spares = {}
    MaxFires = 1
    MaxEdits = 0
    MaxDeletes = 0
    Target = "conv"
    BugEditKeepsOld = FALSE
    BugFireIgnoresAbort = FALSE
INVARIANTS
    TypeOK
    OneResultPerCall
    ToolResultIffFinished
    NoOpenRowAfterDone
PROPERTIES
    RowsClose
    ToolTasksFinish
CHECK_DEADLOCK FALSE
