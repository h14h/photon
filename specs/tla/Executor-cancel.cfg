\* Commands may run forever: a cancel must still end them, with an
\* executor crash, a node crash and a node stop. Expected: no error.
SPECIFICATION SpecUnboundedCommands
CONSTANTS
  NOps = 1
  MaxExecCrash = 1
  MaxOpCrash = 0
  MaxNodeCrash = 1
  MaxNodeStop = 1
  MaxDisconnect = 0
  MaxCancel = 1
  MaxRepush = 0
  BgChildren = TRUE
  Bugs = {}
INVARIANTS
  TypeOK
  AtMostOnceExec
  ResultPhysical
  ResultTruthful
PROPERTIES
  CancelTakesEffect
  ResultsForgotten
CHECK_DEADLOCK FALSE
