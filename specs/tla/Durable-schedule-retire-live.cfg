\* Liveness of a routine retired with no replacement: the owner deletes the
\* schedule, or edits a repeating one into a one-off at the slot it just fired
\* (`arm/4` says `:finished`, so the edit retires the routine and arms none; on
\* the modeled variables that is OwnerDelete). A routine that fires twice and a
\* hub crash. A routine retired while live ends aborted, and nothing runs
\* forever. Expected: no error.
SPECIFICATION Spec
CONSTANTS
    Users = {}
    NTools = 0
    Routines = {"r1"}
    MaxRounds = 2
    MaxCalls = 1
    ToolTypes = {"plain"}
    GenPolicy = "all_settled"
    LLMErrors = FALSE
    MachineOffline = FALSE
    MaxRechecks = 1
    MaxHubCrashes = 1
    MaxSchedCrashes = 0
    MaxStepCrashes = 0
    MaxAborts = 0
    Spares = {}
    MaxFires = 2
    MaxEdits = 0
    MaxDeletes = 1
    Target = "conv"
    BugEditKeepsOld = FALSE
    BugFireIgnoresAbort = FALSE
PROPERTIES
    RetiredEnds
    PlacedSettles
    NoRunningForever
CHECK_DEADLOCK FALSE
