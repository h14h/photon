\* Plan as first written: the node answered op.cancel for an op it didn't
\* have without journaling it. A hub crash rolls back the abort commit after
\* its op.cancel went out. Expected: NoRunAfterCancel violated.
SPECIFICATION Spec
CONSTANTS
  N = 1
  MaxDisconnects = 0
  MaxHubCrashes = 1
  MaxSchedCrashes = 0
  MaxNodeRestarts = 0
  MaxWipes = 0
  MaxStops = 1
  MaxErrors = 0
  MaxRepush = 0
  CmdsEnd = TRUE
  Bugs = {"cancel-unjournaled"}
INVARIANTS NoRunAfterCancel
CHECK_DEADLOCK FALSE
