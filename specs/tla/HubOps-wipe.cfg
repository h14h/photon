\* The node loses its data directory once, plus a disconnect and a Stop.
\* A command may then run twice (the hub never heard of it), so
\* AtMostOnceSpawn and JournalUntilRecorded are left out; KnownNotRerun
\* checks the "known" flag. Expected: no error.
SPECIFICATION Spec
CONSTANTS
  N = 1
  MaxDisconnects = 1
  MaxHubCrashes = 0
  MaxSchedCrashes = 0
  MaxNodeRestarts = 0
  MaxWipes = 1
  MaxStops = 1
  MaxErrors = 0
  MaxRepush = 0
  CmdsEnd = TRUE
  Bugs = {}
INVARIANTS TypeOK KnownNotRerun OneResult ResultFromOwnOp NoStartAfterCancel NoRunAfterCancel NoLiveRowAfterDone ClosedOnlyWhenDone SignalMeansRecorded OfflineNotRun
PROPERTIES CallAnswered CancelTakesEffect ResultsDropped RowsClose
CHECK_DEADLOCK FALSE
