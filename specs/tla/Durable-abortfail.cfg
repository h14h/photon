\* Regression for Durable F7 (a task marked for abort could end failed via
\* on_fail when its step returned before stop_aborted). Before the fix
\* AbortEndsAborted failed (6 states). Expected: no error.
SPECIFICATION Spec
CONSTANTS
    Users = {"u1"}
    NTools = 1
    Routines = {}
    MaxRounds = 3
    MaxCalls = 1
    ToolTypes = {"plain"}
    GenPolicy = "all_settled"
    LLMErrors = FALSE
    MachineOffline = FALSE
    MaxRechecks = 1
    MaxHubCrashes = 0
    MaxSchedCrashes = 0
    MaxStepCrashes = 0
    MaxAborts = 1
INVARIANTS
    TypeOK
    AbortEndsAborted
CHECK_DEADLOCK FALSE
