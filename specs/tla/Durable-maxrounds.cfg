\* Regression for Durable F8 (calls in the last assistant entry of a run that
\* hit the round limit got no tool_result). Before the fix NoOrphanCalls failed
\* (12 states). Expected: no error.
SPECIFICATION Spec
CONSTANTS
    Users = {"u1"}
    NTools = 1
    Routines = {}
    MaxRounds = 2
    MaxCalls = 1
    ToolTypes = {"plain"}
    GenPolicy = "all_settled"
    LLMErrors = FALSE
    MachineOffline = FALSE
    MaxRechecks = 1
    MaxHubCrashes = 0
    MaxSchedCrashes = 0
    MaxStepCrashes = 0
    MaxAborts = 0
    Spares = {}
    MaxFires = 1
    MaxEdits = 0
    MaxDeletes = 0
    Target = "conv"
    BugEditKeepsOld = FALSE
    BugFireIgnoresAbort = FALSE
INVARIANTS
    TypeOK
    NoOrphanCalls
CHECK_DEADLOCK FALSE
