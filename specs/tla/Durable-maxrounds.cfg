\* Regression for Durable F8 (calls in the last assistant entry of a run that
\* hit the round limit got no tool_result). Before the fix NoOrphanCalls failed
\* (12 states). Expected: no error.
SPECIFICATION Spec
CONSTANTS
    Users = {"u1"}
    NTools = 1
    Routines = {}
    MaxRounds = 2
    MaxCalls = 1
    ToolTypes = {"plain"}
    GenPolicy = "all_settled"
    LLMErrors = FALSE
    NodeOffline = FALSE
    MaxHubCrashes = 0
    MaxSchedCrashes = 0
    MaxStepCrashes = 0
    MaxAborts = 0
INVARIANTS
    TypeOK
    NoOrphanCalls
CHECK_DEADLOCK FALSE
