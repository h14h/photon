\* Every fault at once on one op: two executor crashes, an operation
\* process crash, a node crash, a node stop, a dropped connection, an extra
\* op.start and a cancel. Safety only (with liveness this size runs past
\* half an hour). ResultPhysical is left out: a node crash and an operation
\* process crash together reach K2 (Executor-known-orphan-reattached.cfg).
\* Expected: no error.
SPECIFICATION Spec
CONSTANTS
  NOps = 1
  MaxExecCrash = 2
  MaxOpCrash = 1
  MaxNodeCrash = 1
  MaxNodeStop = 1
  MaxDisconnect = 1
  MaxCancel = 1
  MaxRepush = 1
  BgChildren = TRUE
  Bugs = {}
INVARIANTS
  TypeOK
  AtMostOnceExec
  ResultTruthful
CHECK_DEADLOCK FALSE
