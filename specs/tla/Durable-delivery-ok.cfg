\* Every finished node input is delivered at least once across a hub crash,
\* with two user inputs. Expected: no error.
SPECIFICATION Spec
CONSTANTS
    Users = {"u1", "u2"}
    NTools = 1
    Routines = {}
    MaxRounds = 3
    MaxCalls = 1
    ToolTypes = {"node"}
    GenPolicy = "all_settled"
    LLMErrors = FALSE
    NodeOffline = FALSE
    MaxHubCrashes = 1
    MaxSchedCrashes = 0
    MaxStepCrashes = 0
    MaxAborts = 0
PROPERTIES
    DeliveredOnceAnswered
CHECK_DEADLOCK FALSE
