\* Regression for Durable F4, Stop variant (input that arrived while a stopped
\* run was being aborted was stranded). With node reports gone, a routine's
\* prompt is the input that arrives. Expected: no error.
SPECIFICATION Spec
CONSTANTS
    Users = {"u1"}
    NTools = 1
    Routines = {"r1"}
    MaxRounds = 3
    MaxCalls = 1
    ToolTypes = {"machine"}
    GenPolicy = "all_settled"
    LLMErrors = FALSE
    MachineOffline = FALSE
    MaxRechecks = 1
    MaxHubCrashes = 0
    MaxSchedCrashes = 0
    MaxStepCrashes = 0
    MaxAborts = 1
PROPERTIES
    QueuedNotStranded
    PlacedSettles
CHECK_DEADLOCK FALSE
