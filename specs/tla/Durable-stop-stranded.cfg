\* Regression for Durable F4, Stop variant (a node report that arrived while a
\* stopped run was being aborted was stranded). Before the fix
\* DeliveredUnlessWithdrawn failed (19 states). Expected: no error.
SPECIFICATION Spec
CONSTANTS
    Users = {"u1"}
    NTools = 1
    Routines = {}
    MaxRounds = 3
    MaxCalls = 1
    ToolTypes = {"node"}
    GenPolicy = "all_settled"
    LLMErrors = FALSE
    NodeOffline = FALSE
    MaxHubCrashes = 0
    MaxSchedCrashes = 0
    MaxStepCrashes = 0
    MaxAborts = 1
PROPERTIES
    DeliveredUnlessWithdrawn
    QueuedNotStranded
    DeliveredOnceAnswered
CHECK_DEADLOCK FALSE
