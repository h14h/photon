  NOps = 1
  MaxExecCrash = 0
  MaxOpCrash = 0
  MaxNodeCrash = 1
  MaxNodeStop = 0
  MaxDisconnect = 0
  MaxCancel = 0
  MaxRepush = 0
  BgChildren = FALSE
  Bugs = {"no_pid_file"}
INVARIANTS
  ResultPhysical
CHECK_DEADLOCK FALSE
