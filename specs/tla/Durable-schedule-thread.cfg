\* Durable-schedule.cfg with a schedule that starts a new thread at each firing:
\* the firing makes no submission here, so there is no request ID to dedupe on,
\* and only the fence keeps a firing from happening twice or after an edit.
\* Expected: no error.
SPECIFICATION Spec
CONSTANTS
    Users = {"u1"}
    NTools = 0
    Routines = {"r1"}
    MaxRounds = 2
    MaxCalls = 1
    ToolTypes = {"plain"}
    GenPolicy = "all_settled"
    LLMErrors = FALSE
    MachineOffline = FALSE
    MaxRechecks = 1
    MaxHubCrashes = 1
    MaxSchedCrashes = 1
    MaxStepCrashes = 1
    MaxAborts = 1
    Spares = {"r2"}
    MaxFires = 2
    MaxEdits = 1
    MaxDeletes = 1
    Target = "thread"
    BugEditKeepsOld = FALSE
    BugFireIgnoresAbort = FALSE
    BugAskUnfenced = FALSE
    BugAnswerAnyStatus = FALSE
INVARIANTS
    TypeOK
    OneCarrier
    NoFireAfterRetire
    FireOncePerSlot
    BackgroundNotWithdrawn
    AtMostOneActiveRun
    ToolResultIffFinished
    AbortedHasNoLiveFgChildren
    UnsafeAtMostOnce
    PlacedTracked
    NoOrphanCalls
    AbortEndsAborted
    OneResultPerCall
    ClaimedOnce
    NoOpenRowAfterDone
    HookOnce
CHECK_DEADLOCK FALSE
