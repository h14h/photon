\* E1 put back: a cancel kills the command without the canceled marker, so
\* when the executor dies before it journals the canceled snapshot, the
\* resumed op reads the exit status the wrapper recorded for the kill (143)
\* and reports the command completed. Expected: ResultTruthful is violated.
SPECIFICATION Spec
CONSTANTS
  NOps = 1
  MaxExecCrash = 1
  MaxOpCrash = 0
  MaxNodeCrash = 0
  MaxNodeStop = 0
  MaxDisconnect = 0
  MaxCancel = 1
  MaxRepush = 0
  BgChildren = FALSE
  Bugs = {"no_cancel_marker"}
INVARIANTS
  ResultTruthful
CHECK_DEADLOCK FALSE
