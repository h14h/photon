\* What node rule 3 rules out: the node ignores known and runs an op it has
\* no journal for. The node loses its data once. Expected: KnownNotRerun
\* violated.
SPECIFICATION Spec
CONSTANTS
  N = 1
  MaxDisconnects = 0
  MaxHubCrashes = 0
  MaxSchedCrashes = 0
  MaxNodeRestarts = 0
  MaxWipes = 1
  MaxStops = 0
  MaxErrors = 0
  MaxRepush = 0
  CmdsEnd = TRUE
  Bugs = {"no-known"}
INVARIANTS KnownNotRerun
CHECK_DEADLOCK FALSE
