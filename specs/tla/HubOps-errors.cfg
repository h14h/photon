  N = 1
  MaxDisconnects = 1
  MaxHubCrashes = 1
  MaxSchedCrashes = 0
  MaxNodeRestarts = 0
  MaxWipes = 0
  MaxStops = 1
  MaxErrors = 1
  MaxRepush = 1
  CmdsEnd = TRUE
  Bugs = {}
INVARIANTS TypeOK AtMostOnceSpawn OneResult ResultFromOwnOp NoStartAfterCancel NoRunAfterCancel JournalUntilRecorded NoLiveRowAfterDone ClosedOnlyWhenDone SignalMeansRecorded OfflineNotRun
PROPERTIES CallAnswered CancelTakesEffect ResultsDropped RowsClose
