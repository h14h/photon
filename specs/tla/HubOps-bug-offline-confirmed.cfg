\* Plan as first written: the offline result said "didn't run" whenever the
\* row wasn't confirmed. The node ran the command, the socket dropped before
\* any snapshot arrived, and the machine stayed away. Expected:
\* OfflineNotRun violated.
SPECIFICATION Spec
CONSTANTS
  N = 1
  MaxDisconnects = 1
  MaxHubCrashes = 0
  MaxSchedCrashes = 0
  MaxNodeRestarts = 0
  MaxWipes = 0
  MaxStops = 0
  MaxErrors = 0
  MaxRepush = 0
  CmdsEnd = TRUE
  Bugs = {"offline-by-confirmed"}
INVARIANTS OfflineNotRun
CHECK_DEADLOCK FALSE
