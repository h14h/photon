\* F3 put back: the command spawns before its process checkpoint is
\* journaled, so an executor crash before the journal write resumes the op
\* from ready and runs it again. Expected: AtMostOnceExec is violated.
SPECIFICATION Spec
CONSTANTS
  NOps = 1
  MaxExecCrash = 1
  MaxOpCrash = 0
  MaxNodeCrash = 0
  MaxNodeStop = 0
  MaxDisconnect = 0
  MaxCancel = 0
  MaxRepush = 0
  BgChildren = FALSE
  Bugs = {"double_exec"}
INVARIANTS
  AtMostOnceExec
CHECK_DEADLOCK FALSE
