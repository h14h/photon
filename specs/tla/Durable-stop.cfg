\* Regression for Durable F3 (a Stop between handing work to a node and
\* watching it lost the answer), redone for machine calls: a Stop at any point
\* of a machine call cancels its op, or closes a result nobody will claim.
\* Expected: no error.
SPECIFICATION Spec
CONSTANTS
    Users = {"u1"}
    NTools = 1
    Routines = {}
    MaxRounds = 3
    MaxCalls = 1
    ToolTypes = {"machine"}
    GenPolicy = "all_settled"
    LLMErrors = FALSE
    MachineOffline = FALSE
    MaxRechecks = 1
    MaxHubCrashes = 0
    MaxSchedCrashes = 0
    MaxStepCrashes = 0
    MaxAborts = 1
    Spares = {}
    MaxFires = 1
    MaxEdits = 0
    MaxDeletes = 0
    Target = "conv"
    BugEditKeepsOld = FALSE
    BugFireIgnoresAbort = FALSE
INVARIANTS
    TypeOK
    OneResultPerCall
    ToolResultIffFinished
    NoOpenRowAfterDone
    AbortEndsAborted
PROPERTIES
    RowsClose
    AbortCompletes
CHECK_DEADLOCK FALSE
