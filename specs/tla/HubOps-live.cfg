\* Liveness with one call: a disconnect, a hub crash and a Stop; commands
\* end on their own. Safety too. Expected: no error.
SPECIFICATION Spec
CONSTANTS
  N = 1
  MaxDisconnects = 1
  MaxHubCrashes = 1
  MaxSchedCrashes = 0
  MaxNodeRestarts = 0
  MaxWipes = 0
  MaxStops = 1
  MaxErrors = 0
  MaxRepush = 0
  CmdsEnd = TRUE
  Bugs = {}
INVARIANTS TypeOK AtMostOnceSpawn OneResult ResultFromOwnOp NoStartAfterCancel NoRunAfterCancel JournalUntilRecorded NoLiveRowAfterDone ClosedOnlyWhenDone SignalMeansRecorded OfflineNotRun
PROPERTIES CallAnswered CancelTakesEffect ResultsDropped RowsClose
CHECK_DEADLOCK FALSE
