\* Bug config: Durable-schedule.cfg with a fire step whose commit ignores the
\* abort mark (fenced only on its start), so a firing in flight lands after the
\* edit or delete that retired its routine. Expected to fail NoFireAfterRetire.
SPECIFICATION Spec
CONSTANTS
    Users = {}
    NTools = 0
    Routines = {"r1"}
    MaxRounds = 2
    MaxCalls = 1
    ToolTypes = {"plain"}
    GenPolicy = "all_settled"
    LLMErrors = FALSE
    MachineOffline = FALSE
    MaxRechecks = 1
    MaxHubCrashes = 1
    MaxSchedCrashes = 1
    MaxStepCrashes = 1
    MaxAborts = 1
    Spares = {"r2"}
    MaxFires = 2
    MaxEdits = 1
    MaxDeletes = 1
    Target = "conv"
    BugEditKeepsOld = FALSE
    BugFireIgnoresAbort = TRUE
INVARIANTS
    TypeOK
    OneCarrier
    NoFireAfterRetire
    FireOncePerSlot
    BackgroundNotWithdrawn
    AtMostOneActiveRun
    ToolResultIffFinished
    AbortedHasNoLiveFgChildren
    UnsafeAtMostOnce
    PlacedTracked
    NoOrphanCalls
    AbortEndsAborted
    OneResultPerCall
    ClaimedOnce
    NoOpenRowAfterDone
CHECK_DEADLOCK FALSE
