\* K2 (a known gap, Executor.md; partly fixed in G1): after a node crash, a
\* resumed shell that crashes in recover/1, before it reattaches, leaves the
\* command running, and the op fails. (A crash after it reattached is fixed:
\* terminate/2 kills a reattached command.) The open fix: terminate/2 kills
\* the recorded pgid whenever the op is awaiting in phase process. Expected:
\* ResultPhysical is violated.
