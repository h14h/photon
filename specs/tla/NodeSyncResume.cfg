  Inputs = {1}
  MaxDisconnects = 0
  MaxNodeRestarts = 1
  MaxHubRestarts = 0
  MaxCoordCrashes = 0
  MaxRejects = 0
  MaxStops = 0
  MaxRepush = 0
  IdleStopRace = FALSE
INVARIANTS TypeOK HubPrefix InputAtMostOnce SignalAtMostOnce HubAcceptedInLog SettledHasSignal
PROPERTIES AcceptedSettled
