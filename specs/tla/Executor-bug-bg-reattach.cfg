\* F11 put back: a shell that reattached after a node crash checks its
\* process group before the exit file, so a background child that never
\* exits keeps it polling. Expected: CallResult is violated.
SPECIFICATION Spec
CONSTANTS
  NOps = 1
  MaxExecCrash = 0
  MaxOpCrash = 0
  MaxNodeCrash = 1
  MaxNodeStop = 0
  MaxDisconnect = 0
  MaxCancel = 0
  MaxRepush = 0
  BgChildren = TRUE
  Bugs = {"poll_order"}
PROPERTIES
  CallResult
CHECK_DEADLOCK FALSE
