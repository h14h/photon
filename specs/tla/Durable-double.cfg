\* Regression for Durable F1 (one answer reached the user twice), redone for
\* machine calls: no faults, a machine that may be offline and two rechecks, so
\* the call claims, parks again or gives up as its op finishes at any time. The
\* op's result reaches one tool result at most, and every row closes.
\* Expected: no error.
SPECIFICATION Spec
CONSTANTS
    Users = {"u1"}
    NTools = 1
    Routines = {}
    MaxRounds = 3
    MaxCalls = 1
    ToolTypes = {"machine"}
    GenPolicy = "all_settled"
    LLMErrors = FALSE
    MachineOffline = TRUE
    MaxRechecks = 2
    MaxHubCrashes = 0
    MaxSchedCrashes = 0
    MaxStepCrashes = 0
    MaxAborts = 0
    Spares = {}
    MaxFires = 1
    MaxEdits = 0
    MaxDeletes = 0
    Target = "conv"
    BugEditKeepsOld = FALSE
    BugFireIgnoresAbort = FALSE
    BugAskUnfenced = FALSE
    BugAnswerAnyStatus = FALSE
INVARIANTS
    TypeOK
    OneResultPerCall
    ClaimedOnce
    ToolResultIffFinished
    NoOpenRowAfterDone
PROPERTIES
    ToolTasksFinish
    RowsClose
CHECK_DEADLOCK FALSE
