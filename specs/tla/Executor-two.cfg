\* Two ops, so the scan, joins and snapshots cover more than one entry,
\* with an executor crash. Safety only; Executor-two-live.cfg checks
\* liveness on two ops. Two ops interleave freely, so with a cancel, a node
\* crash or liveness as well this shape runs past 15 minutes. Expected: no
\* error.
SPECIFICATION Spec
CONSTANTS
  NOps = 2
  MaxExecCrash = 1
  MaxOpCrash = 0
  MaxNodeCrash = 0
  MaxNodeStop = 0
  MaxDisconnect = 0
  MaxCancel = 0
  MaxRepush = 0
  BgChildren = FALSE
  Bugs = {}
INVARIANTS
  TypeOK
  AtMostOnceExec
  ResultPhysical
  ResultTruthful
CHECK_DEADLOCK FALSE
