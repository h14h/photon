\* Regression for Coordinator F8 (a cancel that reached a shell op before its
\* pid line didn't kill the command, so the stop never completed). Before the
\* fix StopCompletes failed. Expected: no error.
SPECIFICATION SpecUnboundedCommands
CONSTANTS
  ExtInputs = {1}
  MaxCalls = 1
  MaxPerResp = 1
  MaxHB = 0
  MaxStops = 1
  MaxCrash = 0
  MaxNodeCrash = 0
  MaxOpCrash = 0
  MaxDisconnect = 0
  MaxDup = 0
  HBEnabled = FALSE
  BgChildren = FALSE
  ToolMayVanish = FALSE
PROPERTIES
  StopCompletes
