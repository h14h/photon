\* K2 put back (G1's terminate/2): without a port, a shell kills its
\* command only once it has reattached to it, so after a node crash a
\* resumed shell that crashes in recover/1, before it reattaches, leaves the
\* command running while the op fails. Expected: ResultPhysical is violated.
SPECIFICATION Spec
CONSTANTS
  NOps = 1
  MaxExecCrash = 0
  MaxOpCrash = 1
  MaxNodeCrash = 1
  MaxNodeStop = 0
  MaxDisconnect = 0
  MaxCancel = 0
  MaxRepush = 0
  BgChildren = FALSE
  Bugs = {"kill_reattached_only"}
INVARIANTS
  ResultPhysical
CHECK_DEADLOCK FALSE
