\* Safety with a routine posting into the conversation at any time, a machine
\* call on a machine that may be offline, failing model requests, a hub crash, a
\* step crash and a user Stop. Expected: no error.
SPECIFICATION Spec
CONSTANTS
    Users = {"u1"}
    NTools = 1
    Routines = {"r1"}
    MaxRounds = 2
    MaxCalls = 1
    ToolTypes = {"machine"}
    GenPolicy = "all_settled"
    LLMErrors = TRUE
    MachineOffline = TRUE
    MaxRechecks = 1
    MaxHubCrashes = 1
    MaxSchedCrashes = 0
    MaxStepCrashes = 1
    MaxAborts = 1
    Spares = {}
    MaxFires = 1
    MaxEdits = 0
    MaxDeletes = 0
    Target = "conv"
    BugEditKeepsOld = FALSE
    BugFireIgnoresAbort = FALSE
INVARIANTS
    TypeOK
    AtMostOneActiveRun
    ToolResultIffFinished
    AbortedHasNoLiveFgChildren
    UnsafeAtMostOnce
    PlacedTracked
    NoOrphanCalls
    AbortEndsAborted
    OneResultPerCall
    ClaimedOnce
    NoOpenRowAfterDone
    BackgroundNotWithdrawn
CHECK_DEADLOCK FALSE
