\* Safety with a routine posting into the conversation at any time, a node that
\* may be offline, a hub crash, a step crash and a user Stop. Expected: no
\* error.
SPECIFICATION Spec
CONSTANTS
    Users = {"u1"}
    NTools = 1
    Routines = {"r1"}
    MaxRounds = 2
    MaxCalls = 1
    ToolTypes = {"node"}
    GenPolicy = "all_settled"
    LLMErrors = TRUE
    NodeOffline = TRUE
    MaxHubCrashes = 1
    MaxSchedCrashes = 0
    MaxStepCrashes = 1
    MaxAborts = 1
INVARIANTS
    TypeOK
    AtMostOneActiveRun
    ToolResultIffFinished
    AbortedHasNoLiveFgChildren
    UnsafeAtMostOnce
    PlacedTracked
    NoOrphanCalls
    AbortEndsAborted
    NoDoubleDelivery
    ReportsNotWithdrawn
CHECK_DEADLOCK FALSE
