\* Regression for NS-9 (a hub stop in the mailbox of a coordinator that
\* crashed was lost, and the work went on): a stop, a coordinator crash and a
\* node restart. Expected: no error.
SPECIFICATION Spec
CONSTANTS
  Inputs = {1}
  MaxDisconnects = 0
  MaxNodeRestarts = 1
  MaxHubRestarts = 0
  MaxCoordCrashes = 1
  MaxRejects = 0
  MaxStops = 1
  MaxRepush = 0
  IdleStopRace = TRUE
INVARIANTS TypeOK HubPrefix InputAtMostOnce SignalAtMostOnce HubAcceptedInLog SettledHasSignal StopHonored NoInputDuringStop
PROPERTIES StopTakesEffect QueuedAccepted AcceptedSettled
