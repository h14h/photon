  MaxDisconnects = 0
  MaxHubCrashes = 0
  MaxSchedCrashes = 1
  MaxNodeRestarts = 0
  MaxWipes = 0
  MaxStops = 1
  MaxErrors = 0
  MaxRepush = 0
  CmdsEnd = TRUE
  Bugs = {"unfenced-insert"}
