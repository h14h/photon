\* Regression for Durable F6 (Stop withdrew queued background input). With
\* node reports gone, the routine's prompt is the background input a Stop must
\* keep. Expected: no error.
SPECIFICATION Spec
CONSTANTS
    Users = {"u1"}
    NTools = 1
    Routines = {"r1"}
    MaxRounds = 3
    MaxCalls = 1
    ToolTypes = {"machine"}
    GenPolicy = "all_settled"
    LLMErrors = FALSE
    MachineOffline = FALSE
    MaxRechecks = 1
    MaxHubCrashes = 0
    MaxSchedCrashes = 0
    MaxStepCrashes = 0
    MaxAborts = 1
INVARIANTS
    TypeOK
    BackgroundNotWithdrawn
    PlacedTracked
CHECK_DEADLOCK FALSE
