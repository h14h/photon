\* F8 put back: a cancel that reaches the shell before the pid line is
\* forgotten once the pid is known, and a command that never exits runs on.
\* Expected: CancelTakesEffect is violated.
SPECIFICATION SpecUnboundedCommands
CONSTANTS
  NOps = 1
  MaxExecCrash = 0
  MaxOpCrash = 0
  MaxNodeCrash = 0
  MaxNodeStop = 0
  MaxDisconnect = 0
  MaxCancel = 1
  MaxRepush = 0
  BgChildren = FALSE
  Bugs = {"cancel_before_pid"}
PROPERTIES
  CancelTakesEffect
CHECK_DEADLOCK FALSE
