\* A machine call on a machine that may be offline, with two rechecks, a hub
\* crash and a Stop: it parks, gives up, or claims a result that came in
\* meanwhile, and its row always closes. Expected: no error.
SPECIFICATION Spec
CONSTANTS
    Users = {"u1"}
    NTools = 1
    Routines = {}
    MaxRounds = 3
    MaxCalls = 1
    ToolTypes = {"machine"}
    GenPolicy = "all_settled"
    LLMErrors = FALSE
    MachineOffline = TRUE
    MaxRechecks = 2
    MaxHubCrashes = 1
    MaxSchedCrashes = 0
    MaxStepCrashes = 0
    MaxAborts = 1
INVARIANTS
    TypeOK
    OneResultPerCall
    ClaimedOnce
    ToolResultIffFinished
    NoOpenRowAfterDone
    AbortEndsAborted
PROPERTIES
    ToolTasksFinish
    RowsClose
    AbortCompletes
CHECK_DEADLOCK FALSE
