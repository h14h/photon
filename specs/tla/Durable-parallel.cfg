\* Safety with two tool calls in one model response (run in parallel, the
\* generation waits on both), a hub crash and a user Stop. With step crashes
\* and model errors as well this shape grows past 14M states, so those faults
\* are covered by Durable.cfg instead. Expected: no error.
SPECIFICATION Spec
CONSTANTS
    Users = {"u1"}
    NTools = 2
    Routines = {}
    MaxRounds = 2
    MaxCalls = 2
    ToolTypes = {"node", "plain"}
    GenPolicy = "all_settled"
    LLMErrors = FALSE
    NodeOffline = FALSE
    MaxHubCrashes = 1
    MaxSchedCrashes = 0
    MaxStepCrashes = 0
    MaxAborts = 1
INVARIANTS
    TypeOK
    AtMostOneActiveRun
    ToolResultIffFinished
    AbortedHasNoLiveFgChildren
    UnsafeAtMostOnce
    PlacedTracked
    NoOrphanCalls
    AbortEndsAborted
    NoDoubleDelivery
    ReportsNotWithdrawn
CHECK_DEADLOCK FALSE
