\* Safety with two tool calls in one model response (run in parallel, the
\* generation waits on both), failing model requests, a machine that may be
\* offline, a hub crash, a step crash and a user Stop. Expected: no error.
SPECIFICATION Spec
CONSTANTS
    Users = {"u1"}
    NTools = 2
    Routines = {}
    MaxRounds = 2
    MaxCalls = 2
    ToolTypes = {"machine", "plain"}
    GenPolicy = "all_settled"
    LLMErrors = TRUE
    MachineOffline = TRUE
    MaxRechecks = 1
    MaxHubCrashes = 1
    MaxSchedCrashes = 0
    MaxStepCrashes = 1
    MaxAborts = 1
INVARIANTS
    TypeOK
    AtMostOneActiveRun
    ToolResultIffFinished
    AbortedHasNoLiveFgChildren
    UnsafeAtMostOnce
    PlacedTracked
    NoOrphanCalls
    AbortEndsAborted
    OneResultPerCall
    ClaimedOnce
    NoOpenRowAfterDone
CHECK_DEADLOCK FALSE
