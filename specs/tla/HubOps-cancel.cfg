\* Cancels with commands that may run forever: two Stops' worth of budget
\* is one Stop here, plus a disconnect, a hub crash and a node restart.
\* Only a kill ends a command. Expected: no error.
SPECIFICATION Spec
CONSTANTS
  N = 1
  MaxDisconnects = 1
  MaxHubCrashes = 1
  MaxSchedCrashes = 0
  MaxNodeRestarts = 1
  MaxWipes = 0
  MaxStops = 1
  MaxErrors = 0
  MaxRepush = 0
  CmdsEnd = FALSE
  Bugs = {}
INVARIANTS TypeOK AtMostOnceSpawn OneResult ResultFromOwnOp NoStartAfterCancel NoRunAfterCancel JournalUntilRecorded NoLiveRowAfterDone ClosedOnlyWhenDone SignalMeansRecorded OfflineNotRun
PROPERTIES CancelTakesEffect ResultsDropped
CHECK_DEADLOCK FALSE
