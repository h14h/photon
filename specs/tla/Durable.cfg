\* Main model: two user inputs, a machine call or an unsafe plain call, two
\* rounds, failing model requests, a machine that may be offline, a hub crash, a
\* step crash (or a raise in the machine call) and a Stop. Safety invariants.
\* Expected: no error.
SPECIFICATION Spec
CONSTANTS
    Users = {"u1", "u2"}
    NTools = 1
    Routines = {}
    MaxRounds = 2
    MaxCalls = 1
    ToolTypes = {"machine", "plain"}
    GenPolicy = "all_settled"
    LLMErrors = TRUE
    MachineOffline = TRUE
    MaxRechecks = 1
    MaxHubCrashes = 1
    MaxSchedCrashes = 0
    MaxStepCrashes = 1
    MaxAborts = 1
    Spares = {}
    MaxFires = 1
    MaxEdits = 0
    MaxDeletes = 0
    Target = "conv"
    BugEditKeepsOld = FALSE
    BugFireIgnoresAbort = FALSE
    BugAskUnfenced = FALSE
    BugAnswerAnyStatus = FALSE
INVARIANTS
    TypeOK
    AtMostOneActiveRun
    ToolResultIffFinished
    AbortedHasNoLiveFgChildren
    UnsafeAtMostOnce
    PlacedTracked
    NoOrphanCalls
    AbortEndsAborted
    OneResultPerCall
    ClaimedOnce
    NoOpenRowAfterDone
    HookOnce
CHECK_DEADLOCK FALSE
