    MaxFires = 1
    MaxEdits = 0
    MaxDeletes = 0
    Target = "conv"
    BugEditKeepsOld = FALSE
    BugFireIgnoresAbort = FALSE
INVARIANTS
    TypeOK
    PlacedTracked
    AtMostOneActiveRun
    ToolResultIffFinished
PROPERTIES
