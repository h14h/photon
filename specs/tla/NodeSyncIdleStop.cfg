\* Regression for NS-4 (an input sent to a coordinator exiting on :idle_stop
\* was lost): the idle-stop race. Before the fix QueuedAccepted failed (27
\* states). Expected: no error.
SPECIFICATION Spec
CONSTANTS
  Inputs = {1, 2}
  MaxDisconnects = 0
  MaxNodeRestarts = 0
  MaxHubRestarts = 0
  MaxCoordCrashes = 0
  MaxRejects = 0
  MaxStops = 0
  MaxRepush = 0
  IdleStopRace = TRUE
INVARIANTS TypeOK HubPrefix InputAtMostOnce SignalAtMostOnce HubAcceptedInLog SettledHasSignal
PROPERTIES QueuedAccepted
