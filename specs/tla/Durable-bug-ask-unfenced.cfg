\* Bug config: Durable-ask.cfg with Questions.ask/1 inserting the question
\* whatever the task's state (no Rules.askable?/1 check in its commit), so a
\* step orphaned by a Scheduler crash asks after the call was stopped.
\* Expected to fail NoOpenQuestionAfterCall.
SPECIFICATION Spec
CONSTANTS
    Users = {"u1"}
    NTools = 1
    Routines = {}
    MaxRounds = 2
    MaxCalls = 1
    ToolTypes = {"ask"}
    GenPolicy = "all_settled"
    LLMErrors = TRUE
    MachineOffline = FALSE
    MaxRechecks = 1
    MaxHubCrashes = 1
    MaxSchedCrashes = 1
    MaxStepCrashes = 1
    MaxAborts = 1
    Spares = {}
    MaxFires = 1
    MaxEdits = 0
    MaxDeletes = 0
    Target = "conv"
    BugEditKeepsOld = FALSE
    BugFireIgnoresAbort = FALSE
    BugAskUnfenced = TRUE
    BugAnswerAnyStatus = FALSE
INVARIANTS
    TypeOK
    AtMostOneActiveRun
    ToolResultIffFinished
    AbortedHasNoLiveFgChildren
    UnsafeAtMostOnce
    PlacedTracked
    NoOrphanCalls
    AbortEndsAborted
    OneResultPerCall
    ClaimedOnce
    NoOpenRowAfterDone
    HookOnce
    OneQuestionPerCall
    NoOpenQuestionAfterCall
    AnswerOnce
    NoAnswerAfterWithdraw
    AnsweredResult
CHECK_DEADLOCK FALSE
