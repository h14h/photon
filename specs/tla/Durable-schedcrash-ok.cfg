\* A crash of the Scheduler process alone (steps keep running) together with a
\* hub crash and a Stop: the other safety invariants, and placed submissions
\* stay tracked. Expected: no error.
SPECIFICATION Spec
CONSTANTS
    Users = {"u1"}
    NTools = 1
    Routines = {}
    MaxRounds = 2
    MaxCalls = 1
    ToolTypes = {"node", "plain"}
    GenPolicy = "all_settled"
    LLMErrors = TRUE
    NodeOffline = FALSE
    MaxHubCrashes = 1
    MaxSchedCrashes = 1
    MaxStepCrashes = 0
    MaxAborts = 1
INVARIANTS
    TypeOK
    AtMostOneActiveRun
    ToolResultIffFinished
    AbortedHasNoLiveFgChildren
    UnsafeAtMostOnce
    PlacedTracked
    NoDoubleDelivery
CHECK_DEADLOCK FALSE
