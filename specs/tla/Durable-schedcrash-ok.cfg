\* A crash of the Scheduler process alone (steps keep running, and an
\* orphaned machine step may still make its Machines.start/1 commit) together
\* with a hub crash and a Stop: the safety set, with placed submissions
\* tracked and no open row left behind (hub rule 9). Expected: no error.
SPECIFICATION Spec
CONSTANTS
    Users = {"u1"}
    NTools = 1
    Routines = {}
    MaxRounds = 2
    MaxCalls = 1
    ToolTypes = {"machine", "plain"}
    GenPolicy = "all_settled"
    LLMErrors = TRUE
    MachineOffline = FALSE
    MaxRechecks = 1
    MaxHubCrashes = 1
    MaxSchedCrashes = 1
    MaxStepCrashes = 0
    MaxAborts = 1
    Spares = {}
    MaxFires = 1
    MaxEdits = 0
    MaxDeletes = 0
    Target = "conv"
    BugEditKeepsOld = FALSE
    BugFireIgnoresAbort = FALSE
    BugAskUnfenced = FALSE
    BugAnswerAnyStatus = FALSE
INVARIANTS
    TypeOK
    AtMostOneActiveRun
    ToolResultIffFinished
    AbortedHasNoLiveFgChildren
    UnsafeAtMostOnce
    PlacedTracked
    NoOrphanCalls
    AbortEndsAborted
    OneResultPerCall
    ClaimedOnce
    NoOpenRowAfterDone
    HookOnce
CHECK_DEADLOCK FALSE
