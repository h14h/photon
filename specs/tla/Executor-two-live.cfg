\* Liveness (and safety) on two ops with a cancel and no faults: both ops
\* get their results and their entries are forgotten. Two ops interleave
\* freely, so with a fault as well this runs past 15 minutes. Expected: no
\* error.
SPECIFICATION Spec
CONSTANTS
  NOps = 2
  MaxExecCrash = 0
  MaxOpCrash = 0
  MaxNodeCrash = 0
  MaxNodeStop = 0
  MaxDisconnect = 0
  MaxCancel = 1
  MaxRepush = 0
  BgChildren = FALSE
  Bugs = {}
INVARIANTS
  TypeOK
  AtMostOnceExec
  ResultPhysical
  ResultTruthful
PROPERTIES
  CallResult
  CancelTakesEffect
  ResultsForgotten
CHECK_DEADLOCK FALSE
