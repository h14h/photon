\* F9 put back: the executor does not monitor its operation processes, so
\* one that crashes leaves its op unfinished for good. Expected: CallResult
\* is violated.
SPECIFICATION Spec
CONSTANTS
  NOps = 1
  MaxExecCrash = 0
  MaxOpCrash = 1
  MaxNodeCrash = 0
  MaxNodeStop = 0
  MaxDisconnect = 0
  MaxCancel = 0
  MaxRepush = 0
  BgChildren = FALSE
  Bugs = {"unmonitored"}
PROPERTIES
  CallResult
CHECK_DEADLOCK FALSE
