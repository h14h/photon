\* Node rule 10 broken: a stopping shell kills its command without the
\* stopped marker, so the resumed op reads the exit status the wrapper
\* recorded for the kill and reports the command completed. Expected:
\* ResultTruthful is violated.
SPECIFICATION Spec
CONSTANTS
  NOps = 1
  MaxExecCrash = 0
  MaxOpCrash = 0
  MaxNodeCrash = 0
  MaxNodeStop = 1
  MaxDisconnect = 0
  MaxCancel = 0
  MaxRepush = 0
  BgChildren = FALSE
  Bugs = {"no_stopped_marker"}
INVARIANTS
  ResultTruthful
CHECK_DEADLOCK FALSE
