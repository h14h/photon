\* TLC config for hub_restart_catchup.tla
\* MaxLen 3 keeps the log small enough to read a trace by hand.
\* A caught-up link is a quiescent state only until Disconnect or
\* HubCrash; those stay enabled, and Commit* stops at MaxLen. Deadlock
\* checking is off so a fully explored quiescent state is not an error.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANT MaxLen = 3

INVARIANT TypeOK
INVARIANT LinkNeedsHub
INVARIANT HubIsPrefix
INVARIANT ExactlyOnce
INVARIANT OffsetsAreIndexes
INVARIANT DoneSurvives
INVARIANT HighWaterBounded
INVARIANT CursorAgrees
INVARIANT DoneCaughtUp
